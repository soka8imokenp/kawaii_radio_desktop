[package]
name = "kawaii-radio"
version = "0.1.0"
edition = "2024"

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
glyphon = "0.12"
image = { version = "0.25.10", default-features = false, features = ["webp", "png", "jpeg"] }
native-tls = "0.2.18"
pollster = "1.0.1"
rodio = { version = "0.23", default-features = false, features = ["playback", "mp3"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tungstenite = { version = "0.30.0", features = ["native-tls"] }
ureq = { version = "2.12", default-features = false, features = ["native-tls", "json"] }
wgpu = "30"
winit = "0.30"
