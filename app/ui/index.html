<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<title>Kawaii Radio</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="frame">
  <div id="stage" class="dark">
    <!-- everything below sits on the rendered device (assets/<theme>-up.webp) in its 1920 x 1080 coordinates -->


    <!-- live text on the bay -->
    <!-- listeners: a little VFD window — a counter and a row of pixel people that bob to the music -->
    <div id="lis"><div class="cnt" id="lisN">000</div><div class="ppl" id="lisP"></div><div class="lb">TINGLOVCHI</div></div>
    <div id="stationFreq" class="silk"></div>

    <!-- light of the cover spilling over the bay -->
    <div id="spill"></div>
    <!-- trivision cover window -->
    <div id="tv"></div>
    <div id="tvShade"></div>

    <!-- lyrics display -->
    <div id="lyr"><div id="lyrIn">
      <div class="lh"><i class="dotled"></i><b id="lyTitle">—</b><span id="lyArtist"></span></div>
      <div id="lyLines"></div>
      <div id="lyRail"></div>
      <canvas id="viz" width="700" height="300"></canvas>
    </div></div>

    <!-- a module that slides over the lyrics display: search, library, profile -->
    <div id="panel" hidden>
      <div class="ph"><b id="pTitle">QIDIRUV</b><span id="pSub"></span><i id="pClose" title="Yopish">×</i></div>
      <div id="pSearch"><input id="pInput" placeholder="QO'SHIQ YOKI IJROCHI" spellcheck="false"></div>
      <div id="pList"></div>
    </div>

    <!-- the write-head that runs across the display while it redraws a page -->
    <div id="scan"></div>

    <!-- the big LCD -->
    <canvas id="lcd" width="1254" height="152"></canvas>
    <!-- tuner drum -->
    <canvas id="drum" width="500" height="92"></canvas>
    <!-- knob dot -->
    <div id="knobDot"><i></i></div>

    <!-- printer: line counter and the receipt -->
    <div id="qator">QATOR 01/01</div>
    <div id="paperWin"><div id="paper"></div></div>
    <div id="paperEmpty" hidden>TAVSIF TUGMASINI BOSING</div>

    <!-- chat -->
    <div id="chat">
      <div class="ch"><b>CH·01 CHAT</b><span id="chOnline">ulanmoqda…</span><span class="live"><i></i>LIVE</span></div>
      <div id="chPin" hidden><small id="chPinWho">QADALGAN</small><div class="run" id="chPinText"></div></div>
      <div id="chMsgs"></div>
    </div>
    <!-- the input strip under the tube (its keys are in the render) -->
    <div id="chCompose"><div class="cin" id="chInput">KAWAII ID BILAN KIRING</div></div>

    <!-- hit areas and lit overlays for every control (filled in by app.js) -->
    <div id="controls"></div>

    <!-- glass: speculars that slide a little with the pointer -->
    <div class="glass" id="gTv"></div><div class="glass" id="gLyr"></div><div class="glass" id="gLcd"></div><div class="glass" id="gDrum"></div>
    <div id="power"></div>
    <div id="edge"></div>
    <div id="grain"></div>
    <!-- a little LCD toast for things that are not here yet -->
    <div id="toast"></div>
  </div>
</div>
<div id="rz"><i data-d="n"></i><i data-d="s"></i><i data-d="e"></i><i data-d="w"></i><i data-d="nw"></i><i data-d="ne"></i><i data-d="sw"></i><i data-d="se"></i></div>
<audio id="audio" crossorigin="anonymous" preload="auto"></audio>
<script src="app.js"></script>
</body>
</html>
