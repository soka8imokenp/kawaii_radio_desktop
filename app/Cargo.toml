[package]
name = "kawaii-radio-desk"
version = "0.1.0"
description = "Kawaii Radio KR-01 DESK — the desktop radio"
edition = "2021"

[[bin]]
name = "kawaii-radio"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
